<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Store Link Extractor</title>
    <link rel="stylesheet" href="src/popup/popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">Game Store Links</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">🌙 Dark</button>
      </header>

      <p id="status" class="status" role="status">Checking the active tab…</p>

      <div class="result-head">
        <span>Found <strong id="count">0</strong> links</span>
        <span id="store-label" class="badge">—</span>
      </div>

      <label class="sr-only" for="result">Extracted app links</label>
      <textarea id="result" class="result" placeholder="Canonical app URLs appear here, one per line." spellcheck="false" aria-describedby="result-hint"></textarea>
      <p id="result-hint" class="hint">The list is editable — trim it before copying or downloading.</p>

      <p id="error-msg" class="notice hidden" role="alert"></p>

      <div class="actions">
        <button id="run" class="button button--primary" type="button">Extract links</button>
        <div class="actions__row">
          <button id="copy" class="button button--secondary" type="button" disabled>Copy</button>
          <button id="download" class="button button--secondary" type="button" disabled>Download .txt</button>
          <button id="clear" class="button button--secondary" type="button" disabled>Clear</button>
        </div>
      </div>

      <p class="shortcut">Re-run with <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></p>
    </main>

    <footer class="oss-bar">
      <span class="oss-bar__text">Open-source project:</span>
      <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/Game-Store-link-extractor" target="_blank" rel="noopener noreferrer">
        GitHub
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </footer>

    <script type="module" src="src/popup/main.js"></script>
  </body>
</html>
