name: Bug Report
description: Report incorrect extraction results or a broken popup.
title: "fix: [Short description of the bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check existing open and closed issues for duplicates first.

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked existing issues for duplicates.
          required: true
        - label: I am using the latest version of the extension, reloaded from chrome://extensions/.
          required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Chrome version, OS, and extension version from the manifest.
      placeholder: "e.g. Chrome 130 / Windows 11 / extension 3.4.0"
    validations:
      required: true

  - type: input
    id: store-url
    attributes:
      label: Store page URL
      description: The exact Google Play or App Store page where the problem occurs.
      placeholder: "https://play.google.com/store/search?q=..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the store page and scroll to load results.
        2. Open the popup.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual result
      description: Paste the links you got and any errors shown in the popup. Do not paste personal data.
      render: shell
    validations:
      required: true
