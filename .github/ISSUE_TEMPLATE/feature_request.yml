name: Feature Request
description: Suggest an improvement to the extension or its developer workflow.
title: "feat: [Short description of the feature]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the workflow you are trying to speed up.

  - type: textarea
    id: problem-context
    attributes:
      label: Problem context
      description: What is slow, confusing or missing today? Is there a specific store page that triggered it?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution and use cases
      description: Describe the behaviour you expect and who benefits from it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be implemented without new Chrome permissions.
          required: false
